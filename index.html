<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adopt-a-Plot: Organic Farming DApp</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js" type="application/javascript"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; color: #333; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { background-color: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 100%; max-width: 600px; margin-bottom: 20px; }
        h1 { color: #2c3e50; text-align: center; border-bottom: 2px solid #27ae60; padding-bottom: 10px; }
        h2 { color: #2980b9; margin-top: 20px; font-size: 18px; border-bottom: 1px dashed #ccc; padding-bottom: 5px; }
        button { background-color: #27ae60; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-size: 16px; width: 100%; margin-top: 10px; transition: background-color 0.3s; }
        button:hover { background-color: #2ecc71; }
        button:disabled { background-color: #95a5a6; cursor: not-allowed; }
        input[type="text"], input[type="number"] { width: calc(100% - 22px); padding: 10px; margin-top: 10px; margin-bottom: 10px; border: 1px solid #bdc3c7; border-radius: 5px; }
        .info-box { background-color: #ecf0f1; padding: 15px; border-radius: 5px; margin-top: 15px; border-left: 5px solid #3498db; word-break: break-all; }
        .status { margin-top: 10px; font-weight: bold; color: #e74c3c; text-align: center; }
        label { font-weight: bold; color: #7f8c8d; }
    </style>
</head>
<body>

<div class="container">
    <h1>🌱 Adopt-a-Plot</h1>
    <p style="text-align: center; color: #7f8c8d;">Blockchain-based Organic Farming Platform</p>
    
    <button id="connectWalletBtn">🔗 Connect MetaMask Wallet</button>
    <div class="info-box" id="walletInfo" style="display: none;">
        <p><strong>Status:</strong> Connected ✅</p>
        <p><strong>Your Address:</strong> <span id="walletAddress"></span></p>
    </div>
</div>

<div class="container" id="appControls" style="display: none;">
    <h2>1. Adopt a New Plot (Write)</h2>
    <label for="cropTypeInput">Crop Type:</label>
    <input type="text" id="cropTypeInput" placeholder="e.g., Organic Tomato">
    <button id="adoptBtn">🌾 Adopt Plot (Requires Gas)</button>

    <h2>2. Get Plot Details (Read)</h2>
    <label for="plotIdInput">Plot ID:</label>
    <input type="number" id="plotIdInput" placeholder="e.g., 1">
    <button id="getPlotBtn">🔍 Get Details</button>
    <div class="info-box" id="plotInfo" style="display: none;">
        <p><strong>Plot ID:</strong> <span id="infoId"></span></p>
        <p><strong>Status:</strong> <span id="infoStatus"></span></p>
        <p><strong>Crop Type:</strong> <span id="infoCrop"></span></p>
        <p><strong>Owner:</strong> <span id="infoOwner"></span></p>
    </div>

    <h2>3. Update Plot Status (Write)</h2>
    <p style="font-size: 12px; color:#e74c3c;">*Note: Only the plot owner can update the status.</p>
    <label for="updateIdInput">Plot ID:</label>
    <input type="number" id="updateIdInput" placeholder="Plot ID">
    <label for="newStatusInput">New Status:</label>
    <input type="text" id="newStatusInput" placeholder="e.g., Growing / Harvested">
    <button id="updateBtn">🔄 Update Status (Requires Gas)</button>
    
    <p class="status" id="statusMessage"></p>
</div>

<script>
    const contractAddress = "0xc90Fd53ec8F7B729b75c2E969A63f1181990b11f";
    
    const contractABI = [
        "function adoptPlot(string memory _cropType) public",
        "function updatePlotStatus(uint _id, string memory _newStatus) public",
        "function getPlot(uint _id) public view returns (uint, address, string memory, string memory)"
    ];

    let provider;
    let signer;
    let contract;

    const connectWalletBtn = document.getElementById('connectWalletBtn');
    const walletInfo = document.getElementById('walletInfo');
    const walletAddressSpan = document.getElementById('walletAddress');
    const appControls = document.getElementById('appControls');
    const statusMessage = document.getElementById('statusMessage');

    function showStatus(msg) { 
        statusMessage.innerText = msg; 
        setTimeout(() => { statusMessage.innerText = ""; }, 5000); 
    }

    connectWalletBtn.addEventListener('click', async () => {
        if (typeof window.ethereum !== 'undefined') {
            try {
                await window.ethereum.request({ method: 'eth_requestAccounts' });
                
                provider = new ethers.providers.Web3Provider(window.ethereum);
                signer = provider.getSigner();
                const address = await signer.getAddress();
                
                contract = new ethers.Contract(contractAddress, contractABI, signer);
                
                walletAddressSpan.innerText = address;
                walletInfo.style.display = 'block';
                appControls.style.display = 'block';
                connectWalletBtn.style.display = 'none';
                
                showStatus("Wallet connected successfully! Please ensure you are on Sepolia network.");
            } catch (error) {
                console.error("Connection failed", error);
                showStatus("Connection failed. Check console.");
            }
        } else {
            showStatus("Please install MetaMask!");
        }
    });

    document.getElementById('adoptBtn').addEventListener('click', async () => {
        const cropType = document.getElementById('cropTypeInput').value;
        if (!cropType) { showStatus("Please enter a crop type!"); return; }
        
        try {
            showStatus("Waiting for MetaMask confirmation...");
            const tx = await contract.adoptPlot(cropType);
            showStatus("Transaction sent. Waiting for blockchain confirmation...");
            await tx.wait();
            showStatus("Plot adopted successfully!");
        } catch (error) {
            console.error(error);
            showStatus("Transaction failed or rejected.");
        }
    });

    document.getElementById('getPlotBtn').addEventListener('click', async () => {
        const id = document.getElementById('plotIdInput').value;
        if (!id) return;
        
        try {
            const data = await contract.getPlot(id);
            document.getElementById('infoId').innerText = data[0].toString();
            document.getElementById('infoOwner').innerText = data[1];
            document.getElementById('infoCrop').innerText = data[2];
            document.getElementById('infoStatus').innerText = data[3];
            document.getElementById('plotInfo').style.display = 'block';
        } catch (error) {
            console.error(error);
            showStatus("Plot not found. Check the ID.");
        }
    });

    document.getElementById('updateBtn').addEventListener('click', async () => {
        const id = document.getElementById('updateIdInput').value;
        const newStatus = document.getElementById('newStatusInput').value;
        if (!id || !newStatus) { showStatus("Please fill in all fields!"); return; }
        
        try {
            showStatus("Waiting for MetaMask confirmation...");
            const tx = await contract.updatePlotStatus(id, newStatus);
            showStatus("Transaction sent. Waiting for blockchain confirmation...");
            await tx.wait();
            showStatus("Status updated successfully!");
        } catch (error) {
            console.error(error);
            showStatus("Update failed. Are you the owner of this plot?");
        }
    });
</script>

</body>
</html>
